name: Deploy to AWS

on:
  push:
    branches:
      - Master
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  DOTNET_VERSION: "8.0.x"
  NODE_VERSION: "18.x"
  SAM_CLI_VERSION: "1.120.0"

jobs:
  deploy-backend:
    name: Deploy Backend using AWS SAM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup AWS SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          version: ${{ env.SAM_CLI_VERSION }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build SAM application
        run: sam build --use-container --mount-with WRITE

      - name: Deploy SAM application
        run: |
          sam deploy \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --stack-name message-board-app \
            --resolve-s3 \
            --parameter-overrides \
              JwtSecret="${{ secrets.JWT_SECRET }}" \
              JwtIssuer=MessageBoardAPI \
              JwtAudience=MessageBoardClient \
            --capabilities CAPABILITY_IAM \
            --region ${{ env.AWS_REGION }}

      - name: Get Stack Outputs
        id: get-outputs
        run: |
          API_ENDPOINT=$(aws cloudformation describe-stacks \
            --stack-name message-board-app \
            --query 'Stacks[0].Outputs[?OutputKey==`ApiEndpoint`].OutputValue' \
            --output text \
            --region ${{ env.AWS_REGION }})

          BUCKET_NAME=$(aws cloudformation describe-stacks \
            --stack-name message-board-app \
            --query 'Stacks[0].Outputs[?OutputKey==`FrontendBucketName`].OutputValue' \
            --output text \
            --region ${{ env.AWS_REGION }})

          echo "API_ENDPOINT=$API_ENDPOINT" >> $GITHUB_ENV
          echo "BUCKET_NAME=$BUCKET_NAME" >> $GITHUB_ENV
          echo "Backend API deployed at: $API_ENDPOINT"
          echo "Frontend bucket: $BUCKET_NAME"

  deploy-frontend:
    name: Deploy Frontend to AWS S3
    runs-on: ubuntu-latest
    needs: deploy-backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get API Gateway endpoint
        id: get-api
        run: |
          API_ENDPOINT=$(aws cloudformation describe-stacks \
            --stack-name message-board-app \
            --query 'Stacks[0].Outputs[?OutputKey==`ApiEndpoint`].OutputValue' \
            --output text \
            --region ${{ env.AWS_REGION }})

          BUCKET_NAME=$(aws cloudformation describe-stacks \
            --stack-name message-board-app \
            --query 'Stacks[0].Outputs[?OutputKey==`FrontendBucketName`].OutputValue' \
            --output text \
            --region ${{ env.AWS_REGION }})

          echo "API_ENDPOINT=$API_ENDPOINT" >> $GITHUB_ENV
          echo "BUCKET_NAME=$BUCKET_NAME" >> $GITHUB_ENV
          echo "Backend API endpoint: $API_ENDPOINT"
          echo "Frontend bucket: $BUCKET_NAME"

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        env:
          REACT_APP_API_URL: ${{ env.API_ENDPOINT }}
        run: npm run build

      - name: Deploy to S3
        working-directory: ./frontend
        run: |
          aws s3 sync build/ s3://${{ env.BUCKET_NAME }} \
            --delete \
            --cache-control "public, max-age=31536000" \
            --region ${{ env.AWS_REGION }}

          # Update index.html with no cache
          aws s3 cp build/index.html s3://${{ env.BUCKET_NAME }}/index.html \
            --cache-control "no-cache" \
            --content-type "text/html" \
            --region ${{ env.AWS_REGION }}

      - name: Get CloudFront URL and invalidate cache
        id: cloudfront
        run: |
          CLOUDFRONT_URL=$(aws cloudformation describe-stacks \
            --stack-name message-board-app \
            --query 'Stacks[0].Outputs[?OutputKey==`CloudFrontURL`].OutputValue' \
            --output text \
            --region ${{ env.AWS_REGION }})

          DIST_ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?Comment=='message-board-app'].Id" \
            --output text)

          echo "CLOUDFRONT_URL=https://$CLOUDFRONT_URL" >> $GITHUB_ENV
          echo "Frontend deployed at: https://$CLOUDFRONT_URL"

          # Invalidate CloudFront cache
          if [ ! -z "$DIST_ID" ]; then
            aws cloudfront create-invalidation \
              --distribution-id $DIST_ID \
              --paths "/*"
            echo "Cache invalidated for distribution: $DIST_ID"
          fi

      - name: Deployment summary
        run: |
          echo "## Deployment Complete! 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Backend API" >> $GITHUB_STEP_SUMMARY
          echo "- **Endpoint**: ${{ env.API_ENDPOINT }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Lambda Function**: message-board-api" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Frontend" >> $GITHUB_STEP_SUMMARY
          echo "- **S3 Bucket**: ${{ env.BUCKET_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Website URL**: ${{ env.CLOUDFRONT_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Access Your Application" >> $GITHUB_STEP_SUMMARY
          echo "Open: ${{ env.CLOUDFRONT_URL }}" >> $GITHUB_STEP_SUMMARY
