name: Deploy to AWS

on:
  push:
    branches:
      - Master
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  DOTNET_VERSION: "8.0.x"
  NODE_VERSION: "18.x"

jobs:
  deploy-backend:
    name: Deploy Backend to AWS Lambda
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install Lambda tools
        run: dotnet tool install -g Amazon.Lambda.Tools

      - name: Restore dependencies
        working-directory: ./backend
        run: dotnet restore

      - name: Build backend
        working-directory: ./backend
        run: dotnet build --configuration Release --no-restore

      - name: Publish backend
        working-directory: ./backend
        run: dotnet publish --configuration Release --output ./publish

      - name: Package Lambda function
        working-directory: ./backend/publish
        run: zip -r ../lambda-deployment.zip .

      - name: Deploy to Lambda
        working-directory: ./backend
        run: |
          aws lambda update-function-code \
            --function-name message-board-api \
            --zip-file fileb://lambda-deployment.zip \
            --region ${{ env.AWS_REGION }} || \
          aws lambda create-function \
            --function-name message-board-api \
            --runtime dotnet8 \
            --role ${{ secrets.AWS_LAMBDA_ROLE_ARN }} \
            --handler MessageBackend::MessageBackend.LambdaEntryPoint::FunctionHandlerAsync \
            --zip-file fileb://lambda-deployment.zip \
            --timeout 30 \
            --memory-size 512 \
            --region ${{ env.AWS_REGION }}

      - name: Update Lambda configuration
        run: |
          aws lambda update-function-configuration \
            --function-name message-board-api \
            --environment "Variables={JWT_SECRET=${{ secrets.JWT_SECRET }},JWT_ISSUER=MessageBoardAPI,JWT_AUDIENCE=MessageBoardClient,JWT_EXPIRY_MINUTES=60}" \
            --region ${{ env.AWS_REGION }}

      - name: Create or update API Gateway
        run: |
          # Check if API exists
          API_ID=$(aws apigatewayv2 get-apis --query "Items[?Name=='message-board-api'].ApiId" --output text --region ${{ env.AWS_REGION }})

          if [ -z "$API_ID" ]; then
            # Create new HTTP API
            API_ID=$(aws apigatewayv2 create-api \
              --name message-board-api \
              --protocol-type HTTP \
              --target arn:aws:lambda:${{ env.AWS_REGION }}:${{ secrets.AWS_ACCOUNT_ID }}:function:message-board-api \
              --query ApiId --output text \
              --region ${{ env.AWS_REGION }})
            
            echo "Created API Gateway with ID: $API_ID"
          else
            echo "Using existing API Gateway: $API_ID"
          fi

          # Add Lambda permission for API Gateway
          aws lambda add-permission \
            --function-name message-board-api \
            --statement-id apigateway-invoke \
            --action lambda:InvokeFunction \
            --principal apigateway.amazonaws.com \
            --source-arn "arn:aws:execute-api:${{ env.AWS_REGION }}:${{ secrets.AWS_ACCOUNT_ID }}:$API_ID/*" \
            --region ${{ env.AWS_REGION }} || true

          # Get API endpoint
          API_ENDPOINT=$(aws apigatewayv2 get-apis --query "Items[?ApiId=='$API_ID'].ApiEndpoint" --output text --region ${{ env.AWS_REGION }})
          echo "API_ENDPOINT=$API_ENDPOINT" >> $GITHUB_ENV
          echo "Backend API deployed at: $API_ENDPOINT"

  deploy-frontend:
    name: Deploy Frontend to AWS S3
    runs-on: ubuntu-latest
    needs: deploy-backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get API Gateway endpoint
        id: get-api
        run: |
          API_ENDPOINT=$(aws apigatewayv2 get-apis --query "Items[?Name=='message-board-api'].ApiEndpoint" --output text --region ${{ env.AWS_REGION }})
          echo "API_ENDPOINT=$API_ENDPOINT" >> $GITHUB_ENV
          echo "Backend API endpoint: $API_ENDPOINT"

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        env:
          REACT_APP_API_URL: ${{ env.API_ENDPOINT }}
        run: npm run build

      - name: Create S3 bucket if not exists
        run: |
          aws s3 mb s3://message-board-frontend-${{ secrets.AWS_ACCOUNT_ID }} --region ${{ env.AWS_REGION }} || true

          # Enable static website hosting
          aws s3 website s3://message-board-frontend-${{ secrets.AWS_ACCOUNT_ID }} \
            --index-document index.html \
            --error-document index.html \
            --region ${{ env.AWS_REGION }}

          # Configure bucket policy for public read
          aws s3api put-bucket-policy \
            --bucket message-board-frontend-${{ secrets.AWS_ACCOUNT_ID }} \
            --policy '{
              "Version": "2012-10-17",
              "Statement": [{
                "Sid": "PublicReadGetObject",
                "Effect": "Allow",
                "Principal": "*",
                "Action": "s3:GetObject",
                "Resource": "arn:aws:s3:::message-board-frontend-${{ secrets.AWS_ACCOUNT_ID }}/*"
              }]
            }' \
            --region ${{ env.AWS_REGION }}

      - name: Deploy to S3
        working-directory: ./frontend
        run: |
          aws s3 sync build/ s3://message-board-frontend-${{ secrets.AWS_ACCOUNT_ID }} \
            --delete \
            --cache-control "public, max-age=31536000" \
            --region ${{ env.AWS_REGION }}

          # Update index.html with no cache
          aws s3 cp build/index.html s3://message-board-frontend-${{ secrets.AWS_ACCOUNT_ID }}/index.html \
            --cache-control "no-cache" \
            --content-type "text/html" \
            --region ${{ env.AWS_REGION }}

      - name: Create CloudFront distribution
        id: cloudfront
        run: |
          # Check if distribution exists
          DIST_ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?Comment=='message-board-app'].Id" \
            --output text)

          if [ -z "$DIST_ID" ]; then
            echo "Creating CloudFront distribution..."
            
            DIST_ID=$(aws cloudfront create-distribution \
              --origin-domain-name message-board-frontend-${{ secrets.AWS_ACCOUNT_ID }}.s3-website-${{ env.AWS_REGION }}.amazonaws.com \
              --default-root-object index.html \
              --comment "message-board-app" \
              --query 'Distribution.Id' \
              --output text)
            
            echo "Created CloudFront distribution: $DIST_ID"
          else
            echo "CloudFront distribution already exists: $DIST_ID"
            
            # Invalidate cache
            aws cloudfront create-invalidation \
              --distribution-id $DIST_ID \
              --paths "/*"
          fi

          # Get CloudFront domain
          CF_DOMAIN=$(aws cloudfront get-distribution --id $DIST_ID --query 'Distribution.DomainName' --output text)
          echo "Frontend deployed at: https://$CF_DOMAIN"
          echo "CLOUDFRONT_URL=https://$CF_DOMAIN" >> $GITHUB_ENV

      - name: Deployment summary
        run: |
          echo "## Deployment Complete! 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Backend API" >> $GITHUB_STEP_SUMMARY
          echo "- **Endpoint**: ${{ env.API_ENDPOINT }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Lambda Function**: message-board-api" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Frontend" >> $GITHUB_STEP_SUMMARY
          echo "- **S3 Bucket**: message-board-frontend-${{ secrets.AWS_ACCOUNT_ID }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Website URL**: ${{ env.CLOUDFRONT_URL }}" >> $GITHUB_STEP_SUMMARY
